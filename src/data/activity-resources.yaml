# 活动相关信息与资源
#
# 本文件顶层为资源组列表。每条记录描述同一活动下的一类资源；实际链接与发布日期全部写入 links。
# 页面先按 activityId 聚类，再按各资源组中最新的 links[].date 从新到旧排序。
# activityId 必须与 activities.yaml 中某项的 id 完全一致；同一活动可关联任意数量的资源。
# 票务信息仍保存在 activities.yaml 的 ticketInfo 中，不放在本文件。
#
# 数据结构参考：
# - activityId: "2026-example-event" # [必填] 对应 activities.yaml 中的活动 id
#   kind: "post"                     # [必填] announcement | merchandise | post | photo | video | report | other
#   platform: "x"                    # [必填] 资源组的默认平台：x | instagram | youtube | web | other
#   title:                            # [必填] 资源组标题；单链接时也是页面上的链接标题
#     ja: "出演関連投稿"
#     en: "Performance-related Posts"
#   description:                      # [可选] 整组资源共用的补充说明
#     ja: "公演に関連して公開された投稿です。"
#     en: "Posts published in connection with the performance."
#   links:                            # [必填] 一个或多个链接；单链接也必须使用此结构
#     - url: "https://x.com/example/status/123456789" # [必填] 资源地址
#       date: "2026-08-30"            # [必填] 此 URL 的公开日期，YYYY-MM-DD（日本时间）
#       label:
#         ja: "出演者による投稿"
#         en: "Post from a cast member"
#       platform: "instagram"         # [可选] 仅当此 URL 与顶层默认平台不同时覆盖
#       status: "expired"             # [可选] 仅标记这个 URL 已失效
#   status: "expired"                # [可选] 整组链接的默认状态；可被 links[].status 覆盖
#
# kind 表示“资源是什么”，platform 表示“链接在哪里”，两者不要混用。
# - announcement: 官方通知、出演决定、时间变更等
# - merchandise: 会场物贩、商品与购买信息（票务除外）
# - post: X、Instagram 等平台发布的活动相关投稿
# - photo: 官方照片、图集
# - video: 评论视频、活动片段、存档录像
# - report: 新闻报道、活动报告、采访
# - other: 无法归入以上类别的内容
#
# links[].label 可省略；页面会根据 URL 自动显示 X 账号名或网站域名。
# 每个 URL 都拥有自己的 date，顶层不再使用 date 或 url。页面计数按实际链接数计算。
#
# -----------------------------------------------------------------------------
# 填写示例 1：活动结束后的单条 X 投稿
#
# - activityId: "2026-skip-and-loafer-musical"
#   kind: "post"
#   platform: "x"
#   title:
#     ja: "千秋楽終演後コメント"
#     en: "Closing-day Post-performance Comment"
#   description:
#     ja: "千秋楽の終演後に公開された投稿。"
#     en: "A post published after the closing performance."
#   links:
#     - url: "https://x.com/example/status/123456789"
#       date: "2026-03-22"
#
# -----------------------------------------------------------------------------
# 填写示例 2：同一活动、同一类别下的多条投稿归入一个资源组
#
# - activityId: "2026-skip-and-loafer-musical"
#   kind: "photo"
#   platform: "instagram"
#   title:
#     ja: "出演者・関係者による公演写真"
#     en: "Performance Photos from Cast and Staff"
#   links:
#     - url: "https://www.instagram.com/p/EXAMPLE1/"
#       date: "2026-03-21"
#       label:
#         ja: "出演者による投稿"
#         en: "Post from a cast member"
#     - url: "https://www.instagram.com/p/EXAMPLE2/"
#       date: "2026-03-22"
#       label:
#         ja: "千秋楽の写真"
#         en: "Closing-day Photos"
#

