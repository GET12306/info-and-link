# 活动相关信息与资源
#
# 本文件顶层为资源列表。每条记录可以代表一个独立链接，或一组同类链接。
# 页面先按 activityId 聚类，再在每个活动内按 date 从新到旧排序。
# activityId 必须与 activities.yaml 中某项的 id 完全一致；同一活动可关联任意数量的资源。
# 票务信息仍保存在 activities.yaml 的 ticketInfo 中，不放在本文件。
#
# 数据结构参考：
# - activityId: "2026-example-event" # [必填] 对应 activities.yaml 中的活动 id
#   date: "2026-08-30"               # [必填] 此链接内容的公开日期，YYYY-MM-DD（日本时间）
#   kind: "post"                     # [必填] announcement | merchandise | post | photo | video | report | other
#   platform: "x"                    # [必填] x | instagram | youtube | web | other
#   title:                            # [必填] 此链接内容的标题；页面以标题作为链接
#     ja: "出演後コメント"
#     en: "Post-performance Comment"
#   description:                      # [可选] 此链接专用的补充说明
#     ja: "イベント出演後に公開されたコメントです。"
#     en: "A comment published after the event."
#   url: "https://x.com/example/status/123456789" # [单条资源必填] 资源地址
#   links:                           # [资源组必填] 与 url 二选一；字符串适合快速批量粘贴
#     - "https://x.com/example/status/123456789"
#     - url: "https://x.com/example/status/987654321" # 需要时可单独覆盖字段
#       date: "2026-08-31"
#       label:
#         ja: "出演者による投稿"
#         en: "Post from a cast member"
#       status: "expired"
#   status: "expired"                # [可选] expired=显示失效标记；available 或省略时不显示
#
# kind 表示“资源是什么”，platform 表示“链接在哪里”，两者不要混用。
# - announcement: 官方通知、出演决定、时间变更等
# - merchandise: 会场物贩、商品与购买信息（票务除外）
# - post: X、Instagram 等平台发布的活动相关投稿
# - photo: 官方照片、图集
# - video: 评论视频、活动片段、存档录像
# - report: 新闻报道、活动报告、采访
# - other: 无法归入以上类别的内容
#
# 大量返图使用 links 资源组。字符串链接会根据 URL 自动显示 X 账号名或网站域名；
# 只有需要独立标题、日期或状态的链接才写成对象。页面计数按实际链接数计算。
#
# -----------------------------------------------------------------------------
# 填写示例 1：活动结束后的 X 投稿
#
# - activityId: "2026-skip-and-loafer-musical"
#   date: "2026-03-22"
#   kind: "post"
#   platform: "x"
#   title:
#     ja: "千秋楽終演後コメント"
#     en: "Closing-day Post-performance Comment"
#   description:
#     ja: "千秋楽の終演後に公開された投稿。"
#     en: "A post published after the closing performance."
#   url: "https://x.com/example/status/123456789"
#
# -----------------------------------------------------------------------------
# 填写示例 2：同一活动的 Instagram 场贩信息作为另一条独立资源
#
# - activityId: "2026-skip-and-loafer-musical"
#   date: "2026-03-01"
#   kind: "merchandise"
#   platform: "instagram"
#   title:
#     ja: "劇場販売グッズ情報"
#     en: "Theater Merchandise Information"
#   description:
#     ja: "公演会場で販売される商品の一覧と案内。"
#     en: "Details and a list of merchandise sold at the venue."
#   url: "https://www.instagram.com/p/EXAMPLE/"
#   status: "expired"
#

