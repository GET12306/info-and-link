# 数据结构参考（依据当前 Activity / TicketInfo 类型与页面读取逻辑）
# [必填] 缺少后页面无法正常展示；[可选] 可整项省略，不要用空字符串代替。
# 字段规则：活动与票务条目均使用 scheduleLabel 保存自由书写的显示日程。票务的 startAt/endAt 可写
#          YYYY-MM-DD 或 YYYY-MM-DDTHH:mm；省略时间时，开始按 00:00、结束按 23:59 计算。均为日本时间。
#
# - id: "2026-example-event"          # [必填] 全局唯一且永久不变的标识；小写字母、数字及连字符
#   category: "Event"                 # [必填] 分类：Stage | Musical | Program | Event | Live | Reading | Other
#                                     # 舞台/音乐剧/直播节目/线下活动/live/朗读剧/其他
#                                        # Program=配信番組，Event=リアルイベント
#   scheduleLabel: "2026.08.11"       # [必填] 活动页的日程显示文字；不参与日期计算，建议加引号
#   startDate: "2026-08-11"           # [条件必填] 连续活动首日；与 performances 二选一
#   endDate: "2026-08-12"             # [可选] 连续活动末日；省略时视为单日活动
#   recurrence:                        # [可选] 经常性节目；存在时不会因已知场次过期而进入历史
#     type: "manual"                   # manual：月更/不定期；在 performances 中逐项添加已确认日期
#   calendarExport: "auto"             # [可选] 默认 auto：所有场次有准确开始时间才开放 ICS 下载
#                                      # enabled：手动开放，允许仅日期的全天占位；仍必须有有效日期、标题和链接
#                                      # disabled：手动隐藏下载；导入后不会自动更新，修改本站数据不会改变已导入的日程
#   durationMinutes: 120               # [可选] 所有定时场次的统一时长（分钟）；默认 90，可被场次 endAt 覆盖
#   performances:                      # [条件必填] 非连续日期或精确场次；与 startDate/endDate 二选一
#     - occursOn: "2026-08-10"         # [二选一] 仅知日期的场次；作为全天日程显示
#       label:                         # [可选] 场次名称
#         ja: "出演日"
#         en: "Performance date"
#       milestones:                    # [可选] 当天的辅助时刻；不改变全天属性、主日程结束时间或活动状态
#         - kind: "update"             # update：情报、节目或内容的公开/更新时间
#           at: "12:00"                # [必填] HH:mm，日本时间；会显示在首页日历和活动日程中
#     - startAt: "2026-08-11T14:30"    # [二选一] 日本时间的场次开始时刻
#       endAt: "2026-08-11T16:30"      # [可选] 此场次的特殊结束时刻；优先于 durationMinutes
#       label:                         # [可选] 昼公演、夜公演等场次名称
#         ja: "昼公演"
#         en: "Matinee"
#       milestones:                    # [可选] 同一场次的开场、物贩或其他辅助时刻；可按日历设置单独导出
#         - kind: "merch"              # merch：物贩或周边销售开始时间；可用 until 表示销售时段
#           at: "12:00"
#           until: "13:30"             # [可选] 同一天的结束时刻，必须晚于 at
#         - kind: "doors"              # doors：开场/开放入场时间；不是活动的正式开演时间
#           at: "14:00"
#         - kind: "other"              # other：上述类别以外的辅助时刻，必须填写日英双语 label
#           at: "13:45"
#           label:
#             ja: "整列開始"
#             en: "Line-up starts"
#     - startAt: "2026-08-11T18:30"    # 同一天可添加多个场次；日历会分别显示为多条事件
#       label:
#         ja: "夜公演"
#         en: "Evening"
#   title:                             # [必填] 活动标题
#     ja: "活动名"
#     en: "Activity title"
#   venueIds: ["example-venue"]        # [可选] venues.yaml 中的场馆 ID；多场馆按显示顺序填写多个 ID
#   venueNote:                         # [可选] 城市、区域或尚未公布的场馆等无法使用 ID 的地点说明
#     ja: "東京都内"
#     en: "Tokyo"
#   description:                       # [可选] 角色、出演方式等补充说明；场地请写入 venueIds / venueNote
#     ja: "ゲスト出演"
#     en: "Guest appearance"
#   link: "https://example.com/event" # [必填] 活动链接；也是票务条目链接的最终回退地址
#   ticketInfo:                        # [可选] 仅有票务信息时添加
#     link: "https://example.com/tickets" # [可选] 票务总览链接；entry.link 缺失时回退到这里
#     price:                           # [可选] 所有票务阶段共用的价格；可被 entry.price 覆盖
#       ja: "9,900円"
#       en: "9,900 yen"
#     entries:                         # [必填/仅 ticketInfo 内] 一个或多个票务阶段
#       - type:                        # [必填] 抽选、先行、一般发售等名称
#           ja: "一般発売"
#           en: "General Sale"
#         startAt: "2026-07-11T12:00"  # [可选] 开始日或时刻；无 T 时默认当天 00:00
#         endAt: "2026-07-20"          # [可选] 截止日或时刻；无 T 时默认当天 23:59；不明时可用活动 endDate
#         scheduleLabel: "2026.07.11-07.20" # [必填] 两种语言共用的显示日程；不参与状态计算
#         price:                       # [可选] 仅在此阶段价格不同时填写，覆盖 ticketInfo.price
#           ja: "当日券 10,500円"
#           en: "Same-day ticket: 10,500 yen"
#         description:                 # [可选] 申请条件等补充说明；与活动的 description 含义一致
#           ja: "注意事項"
#           en: "Additional note"
#         link: "https://example.com/entry" # [可选] 此票务条目链接；回退顺序为 entry → ticketInfo → activity
#
# 每周固定节目使用以下有限生成规则替代 performances；只生成 startOn 到 endOn 范围内符合星期的日期：
# recurrence:
#   type: "weekly"
#   startOn: "2026-09-01"             # [必填] 已知日程范围起点，不一定需要正好落在固定星期
#   endOn: "2026-09-30"               # [必填] 已知日程范围终点；必须显式延长，不会无限生成
#   weekday: "friday"                 # [必填] sunday | monday | tuesday | wednesday | thursday | friday | saturday
#   startTime: "22:00"                # [必填] 每次默认开始/更新时间，HH:mm 日本时间
#   overrides:                         # [可选] 只记录范围内某次的改时或取消
#     - date: "2026-09-18"            # [必填] 原本由规则生成的日期
#       startTime: "22:30"            # [可选] 仅覆盖这一次的默认时间
#     - date: "2026-09-25"
#       cancelled: true                # [可选] 不生成这一次；不能与 startTime 同时使用
#
