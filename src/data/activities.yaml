# 数据结构参考（依据当前 Activity / TicketInfo 类型与页面读取逻辑）
# [必填] 缺少后页面无法正常展示；[可选] 可整项省略，不要用空字符串代替。
# 字段规则：活动与票务条目均使用 scheduleLabel 保存自由书写的显示日程；用于状态和排序的日期必须是 YYYY-MM-DD，
#          精确时间必须是 YYYY-MM-DDTHH:mm。所有日期时间均按日本标准时间（Asia/Tokyo）解释。
#
# - category: "Event"                 # [必填] 分类：Stage | Musical | Program | Event | Live | Reading | Other
#                                     # 舞台/音乐剧/直播节目/线下活动/live/朗读剧/其他
#                                        # Program=配信番組，Event=リアルイベント
#   scheduleLabel: "2026.08.11"       # [必填] 活动页的日程显示文字；不参与日期计算，建议加引号
#   startDate: "2026-08-11"           # [可选] 首日；用于日历及 upcoming/ongoing/past 判定
#   endDate: "2026-08-12"             # [可选] 连续活动末日；单日活动可省略
#   activeDates:                       # [可选] 非连续出演的准确日期；存在时优先于 startDate/endDate
#     - "2026-08-11"
#     - "2026-08-12"
#   performances:                      # [可选] 精确场次；存在时优先于 activeDates/startDate/endDate
#     - startAt: "2026-08-11T14:30"    # [必填/仅 performances 内] 日本时间的场次开始时刻
#       endAt: "2026-08-11T16:30"      # [可选] 日本时间的场次结束时刻；省略时默认为 startAt 后 1 小时
#       label:                         # [可选] 昼公演、夜公演等场次名称
#         ja: "昼公演"
#         en: "Matinee"
#     - startAt: "2026-08-11T18:30"    # 同一天可添加多个场次；日历会分别显示为多条事件
#       label:
#         ja: "夜公演"
#         en: "Evening"
#   title:                             # [必填] 活动标题
#     ja: "活动名"
#     en: "Activity title"
#   venue:                              # [可选] 活动场地；活动页、票务页及未来日历共同使用
#     ja: "会場名"
#     en: "Venue"
#   description:                       # [可选] 角色、出演方式等补充说明；场地请写入 venue
#     ja: "ゲスト出演"
#     en: "Guest appearance"
#   link: "https://example.com/event" # [必填] 活动链接；也是票务条目链接的最终回退地址
#   ticketInfo:                        # [可选] 仅有票务信息时添加
#     link: "https://example.com/tickets" # [可选] 票务总览链接；entry.link 缺失时回退到这里
#     entries:                         # [必填/仅 ticketInfo 内] 一个或多个票务阶段
#       - type:                        # [必填] 抽选、先行、一般发售等名称
#           ja: "一般発売"
#           en: "General Sale"
#         startDate: "2026-07-11"     # [可选] 开始日；开始前显示 upcoming
#         endDate: "2026-07-20"       # [可选] 截止日；次日起进入历史票务；截止不明时使用所属活动的 endDate
#         startAt: "2026-07-11T12:00"  # [可选] 日本时间的精确开始时刻；存在时优先于 startDate
#         endAt: "2026-07-20T23:59"    # [可选] 日本时间的精确截止时刻；存在时优先于 endDate
#         scheduleLabel: "2026.07.11-07.20" # [必填] 两种语言共用的显示日程；不参与状态计算
#         price:                       # [必填] 价格说明
#           ja: "9,900円"
#           en: "9,900 yen"
#         description:                 # [可选] 申请条件等补充说明；与活动的 description 含义一致
#           ja: "注意事項"
#           en: "Additional note"
#         link: "https://example.com/entry" # [可选] 此票务条目链接；回退顺序为 entry → ticketInfo → activity
#
