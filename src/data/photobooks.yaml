- id: "coco-20anniv-cocokara-photobook"
  title:
    ja: "林鼓子 ここから。"
    en: "Coco Hayashi. From here."
  subtitle:
    ja: "林鼓子20歳記念メモリアルフォトエッセイ「林鼓子 ここから。」"
    en: "Coco Hayashi's first photobook, released on her 24th birthday"
  releaseDate: "2022-10"
  description:
    ja: |
      林個人として、初めてのフォトエッセイとなる本書籍には、本人が綴った書き下ろしエッセイや、
      TVアニメ「キラッとプリ☆チャン」内のユニット「ミラクル☆キラッツ」で共演した声優久保田未夢との特別対談、
      そして、「i☆Ris」芹澤 優や若井友希ら先輩声優や、RGR森嶋優花、厚木那奈美らからのスペシャルメッセージを掲載予定。

      さらに、東京に加え、出身地である静岡県浜松市で撮影が決定。
      まさに林の「これまで、今、これから」がたくさん詰まった記念の一冊。
    en: |
      This book, Hayashi's first personal photo essay, features original essays written by Hayashi herself,
      a special interview with voice actress Miyu Kubota co-star in the unit “Miracle☆Kirats” from the TV anime *KiraKira Pri☆Chan*—
      as well as special messages from senior voice actors such as Yu Serizawa and Yuki Wakai of “i☆Ris,” Yuka Morishima of RGR, Nanami Atsugi.

      In addition to Tokyo, a photo shoot has been scheduled in Hamamatsu, Shizuoka, her hometown.
      This commemorative volume is truly packed with Hayashi's “past, present, and future.”
