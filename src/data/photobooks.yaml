- id: "coco-1st-photobook"
  title:
    ja: "林鼓子1st写真集 coco"
    en: "Coco Hayashi 1st Photobook coco"
  subtitle:
    ja: "24歳の誕生日に刊行された、林鼓子初の写真集"
    en: "Coco Hayashi's first photobook, released on her 24th birthday"
  releaseDate: "2026-05-15"
  description:
    ja: |
      林鼓子さん24歳の誕生日に発売となる今作の撮影地は南国・マレーシア。常夏の楽園、日差しの下ではしゃぐ等身大の姿から、本人発案の『オフィーリア』をイメージした全身びしょ濡れカット、距離感の近い部屋着のシチュエーションほか、“初めての挑戦”として数パターンの水着にもチャレンジ! 10代から声優として活動をスタートし、最近では舞台俳優としての活躍も目覚ましい林さんの新境地が詰め込まれた一冊となっている。
    en: |
      This photo shoot, set to be released on Coco Hayashi's 24th birthday, took place in the tropical paradise of Malaysia. From her natural, life-sized moments frolicking under the sun in this eternal summer paradise, to a shot where she's completely soaked—inspired by her own concept of “Ophelia”—and intimate scenes in loungewear, she also takes on several different swimsuit looks as her “first-time challenges”! This book is packed with new facets of Hayashi, who began her career as a voice actress in her teens and has recently been making remarkable strides as a stage actress.
