  description:
    ja: |
      沖縄の太陽下、林鼓子さんが贈る眩しい笑顔！ この沖縄フォトブックは彼女の輝く瞬間を目撃しましょう。 独創的な衣装とヘアメイクで魅せてくれる、新しい林鼓子さんがココにあります！ 彼女の自然な美しさと沖縄の美しい風景が織り成すたっぷり詰まった一冊です！
    en: |
      Under the Okinawan sun, Coco Hayashi beams with a dazzling smile! This Okinawa photo book lets you witness her most radiant moments. Discover a whole new side of Koko Hayashi as she captivates with her unique outfits, hairstyles, and makeup! This book is packed with images that beautifully blend her natural beauty with the stunning scenery of Okinawa!
